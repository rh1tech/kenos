# kenos.rh1.tech — static marketing / support / privacy site.
#
# Reference copy of /etc/nginx/vhosts/kenos.rh1.tech.conf on rbx1. Content is
# deployed by rsync from site/ in this repo into /var/www/kenos-site.
# Cloudflare fronts nginx; the shared rh1-tech-ssl snippet rejects traffic that
# did not come through Cloudflare.
#
# Security headers are repeated in every location that sets a header of its
# own: nginx's add_header does not inherit into a block that declares one.
server {
    server_name kenos.rh1.tech;
    access_log /var/log/nginx/kenos.rh1.tech_access.log;
    error_log  /var/log/nginx/kenos.rh1.tech_error.log;

    root /var/www/kenos-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # App updates — DMG / ZIP / appcast. Long cache for versioned archives is
    # fine; appcast.json must revalidate so the updater sees new builds.
    location = /appcast.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }
    location /download/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location ~* ^/assets/(fonts|img)/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    listen 443 ssl;
    include /etc/nginx/snippets/rh1-tech-ssl.conf;
}
server {
    if ($host = kenos.rh1.tech) { return 301 https://$host$request_uri; }
    server_name kenos.rh1.tech;
    listen 80;
    return 404;
}
